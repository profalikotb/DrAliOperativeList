<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة العمليات القادمة - أ.د. على قطب</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #eef5f9, #dcebf4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      direction: rtl;
    }

    .card {
      width: min(90%, 500px);
      background: white;
      border-radius: 18px;
      padding: 35px 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 8px;
      color: #174b6f;
      font-size: 28px;
    }

    p {
      color: #64748b;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .open-btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      background: #174b6f;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      box-sizing: border-box;
    }

    .open-btn:hover {
      background: #206a8a;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>قائمة العمليات القادمة</h1>

    <p>أ.د. على قطب<br>جراحة المخ والأعصاب</p>

    <a
      class="open-btn"
      href="https://script.google.com/macros/s/AKfycbyuzUqpdRl3Jl-IlT4M2bbOWMta2ehuNt62kHMfuKq_VLVSLUR-nQx9EoK4k69qhCuP/exec">
      فتح قائمة العمليات
    </a>

  </div>

</body>
</html>
